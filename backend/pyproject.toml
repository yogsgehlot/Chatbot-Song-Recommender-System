[project]
name = "music-recommender-backend"
version = "0.1.0"
description = "Conversational AI Music Recommendation System"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Data validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # Database
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",

    # Environment management
    "python-dotenv>=1.0.1",

    # HTTP client (for LLM APIs and tests)
    "httpx>=0.27.2",

    # LLM providers
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",

    # LangGraph for stateful workflows
    "langgraph>=0.2.0",

    # Data science
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",

    # Semantic embeddings (optional — used in Phase 2+)
    # "sentence-transformers>=3.2.0",
    # "faiss-cpu>=1.8.0",

    # NLP
    "nltk>=3.9.0",
    "textblob>=0.18.0",

    # Utilities
    "python-multipart>=0.0.12",
    "uuid7>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "UP", "N", "B", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "scripts/*"]

[tool.setuptools]
packages = ["app"]

